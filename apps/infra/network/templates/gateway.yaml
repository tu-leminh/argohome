apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  # No spec.addresses: Cilium would request exactly those IPs and never add
  # the IPv6 one. The Gateway's Service gets one IP per family from the pools
  # that select it instead (lb-pool.yaml, ipv6-prefix-sync.yaml).
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Same (not All): only the catch-all redirect HTTPRoute in this
        # namespace (infra) should ever bind here. If app HTTPRoutes could
        # attach too, their more-specific hostnames would win over the
        # catch-all and serve plaintext instead of redirecting.
        namespaces:
          from: Same
    {{- range $name, $cert := .Values.certs }}
    {{- if $cert.wildcard }}
    - name: {{ $name }}-wildcard
      protocol: HTTPS
      port: 443
      hostname: {{ $cert.wildcard | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $cert.secretName }}
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ $name }}-apex
      protocol: HTTPS
      port: 443
      hostname: {{ $cert.apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $cert.secretName }}
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    {{- else }}
    - name: {{ $name }}
      {{- with $cert.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $cert.secretName }}
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
    {{- end }}
