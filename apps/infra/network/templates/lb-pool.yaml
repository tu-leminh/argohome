apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: home-pool
spec:
  blocks:
    - start: {{ (splitList "-" .Values.pool.ipv4) | first | quote }}
      stop: {{ (splitList "-" .Values.pool.ipv4) | last | quote }}
  serviceSelector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: DoesNotExist
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: infra-gateway-ipv4
spec:
  blocks:
    - start: {{ .Values.gateway.ipv4 | quote }}
      stop: {{ .Values.gateway.ipv4 | quote }}
  serviceSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: home-l2
spec:
  interfaces:
    - "^enp6s0$"
  externalIPs: true
  loadBalancerIPs: true
