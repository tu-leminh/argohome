# Admin login for OpenBao. Self-init revokes the root token, so the `admin`
# Kubernetes-auth role (see values.yaml) is bound to this account:
#   jwt=$(kubectl -n infra create token openbao-admin)
#   bao write auth/kubernetes/login role=admin jwt="$jwt"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  namespace: {{ .Release.Namespace }}
