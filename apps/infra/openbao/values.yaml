openbao:
  global:
    tlsDisable: true
  injector:
    enabled: false
  ui:
    enabled: true
  server:
    # Standalone, single replica, file-backed on the static tier1 PV from
    # apps/infra/storage (the chart's own volumeClaimTemplate can't bind to it).
    dataStorage:
      enabled: false
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: infra-openbao-tier1-data-pvc
    volumeMounts:
      - name: data
        mountPath: /openbao/data
    statefulSet:
      securityContext:
        pod:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        container:
          runAsUser: 1000
          runAsGroup: 1000
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "pebbledb" {
          path = "/openbao/data/pebbledb"
        }
