jobs:
  duckdns-updater:
    runOnStartup: true
    schedule: "*/20 * * * *"
    image: curlimages/curl:latest
    domain: epricesx
    env:
      - name: DUCKDNS_TOKEN
        valueFrom:
          secretKeyRef:
            name: duckdns-secret
            key: DUCKDNS_TOKEN

  freemyip-updater:
    runOnStartup: true
    schedule: "5-59/20 * * * *"
    image: curlimages/curl:latest
    domain: lmtu.freemyip.com
    env:
      - name: FREEMYIP_TOKEN
        valueFrom:
          secretKeyRef:
            name: freemyip-secret
            key: FREEMYIP_TOKEN

  myaddr-updater:
    runOnStartup: true
    schedule: "10-59/20 * * * *"
    image: curlimages/curl:latest
    env:
      - name: MYADDR_KEY
        valueFrom:
          secretKeyRef:
            name: myaddr-secret
            key: MYADDR_KEY

  configarr:
    schedule: "0 0 * * 0"  # weekly, Sunday midnight; trigger on-demand via Argo CD "Create Job"
    image: ghcr.io/raydak-labs/configarr:latest
    useImageEntrypoint: true
    env:
      - name: SONARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: configarr-env
            key: SONARR_API_KEY
      - name: RADARR_API_KEY
        valueFrom:
          secretKeyRef:
            name: configarr-env
            key: RADARR_API_KEY
    volumes:
      - name: repos
        persistentVolumeClaim:
          claimName: infra-configarr-repos-pvc
      - name: configarr-config
        configMap:
          name: configarr-config
    volumeMounts:
      - name: repos
        mountPath: /app/repos
      - name: configarr-config
        mountPath: /app/config/config.yml
        subPath: config.yml
        readOnly: true
