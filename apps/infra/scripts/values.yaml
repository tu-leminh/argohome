jobs:
  duckdns-updater:
    runOnStartup: true
    schedule: "*/20 * * * *"
    image: curlimages/curl:latest
    domain: epricesx
    env:
      - name: DUCKDNS_TOKEN
        valueFrom:
          secretKeyRef:
            name: duckdns-secret
            key: DUCKDNS_TOKEN

  freemyip-updater:
    runOnStartup: true
    schedule: "5-59/20 * * * *"
    image: curlimages/curl:latest
    domain: lmtu.freemyip.com
    env:
      - name: FREEMYIP_TOKEN
        valueFrom:
          secretKeyRef:
            name: freemyip-secret
            key: FREEMYIP_TOKEN

  myaddr-updater:
    runOnStartup: true
    schedule: "10-59/20 * * * *"
    image: curlimages/curl:latest
    env:
      - name: MYADDR_KEY
        valueFrom:
          secretKeyRef:
            name: myaddr-secret
            key: MYADDR_KEY

  configarr:
    schedule: "0 0 * * 0"  # weekly, Sunday midnight; trigger on-demand via Argo CD "Create Job"
    image: ghcr.io/raydak-labs/configarr:latest
    useImageEntrypoint: true
    # Sonarr/Radarr don't expose their API key as a secret - it lives in
    # <ApiKey> inside each app's config.xml. Extract it at runtime from the
    # read-only config PV mirrors instead of hardcoding it as a k8s secret.
    initContainers:
      - name: extract-api-keys
        image: alpine:3.20
        command:
          - sh
          - -c
          - |
            set -eu
            key=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /sonarr-config/config.xml)
            printf '%s' "$key" > /secrets/SONARR_API_KEY
            key=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /radarr-config/config.xml)
            printf '%s' "$key" > /secrets/RADARR_API_KEY
        volumeMounts:
          - name: sonarr-config
            mountPath: /sonarr-config
            readOnly: true
          - name: radarr-config
            mountPath: /radarr-config
            readOnly: true
          - name: extracted-secrets
            mountPath: /secrets
    volumes:
      - name: repos
        persistentVolumeClaim:
          claimName: infra-configarr-repos-pvc
      - name: configarr-config
        configMap:
          name: configarr-config
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: infra-sonarr-config-ro-pvc
      - name: radarr-config
        persistentVolumeClaim:
          claimName: infra-radarr-config-ro-pvc
      - name: extracted-secrets
        emptyDir: {}
    volumeMounts:
      - name: repos
        mountPath: /app/repos
      - name: configarr-config
        mountPath: /app/config/config.yml
        subPath: config.yml
        readOnly: true
      - name: extracted-secrets
        mountPath: /app/secrets
        readOnly: true
