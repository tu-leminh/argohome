apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |
    trashGuideUrl: https://github.com/TRaSH-Guides/Guides
    recyclarrConfigUrl: https://github.com/recyclarr/config-templates

    sonarr:
      sonarr:
        base_url: http://media-sonarr.media:8989
        api_key: !file /app/secrets/SONARR_API_KEY
        quality_definition:
          type: anime
        delete_unmanaged_custom_formats:
          enabled: true
        include:
          - template: sonarr-quality-definition-anime
          - template: sonarr-v4-quality-profile-web-1080p
          - template: sonarr-v4-custom-formats-web-1080p
          - template: sonarr-v4-quality-profile-web-2160p
          - template: sonarr-v4-custom-formats-web-2160p
          - template: sonarr-v4-quality-profile-anime
          - template: sonarr-v4-custom-formats-anime
        custom_formats:
          - trash_ids:
              - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
            assign_scores_to:
              - name: "Remux-1080p - Anime"
                score: 2000
          - trash_ids:
              - 7ba05c6e0e14e793538174c679126996  # MULTi
            assign_scores_to:
              - name: "Remux-1080p - Anime"
                score: 2000
          - trash_ids:
              - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            assign_scores_to:
              - name: "Base Profile"
                score: 101
              - name: "WEB-1080p"
                score: 101
              - name: "WEB-2160p"
                score: 101
              - name: "Remux-1080p - Anime"
                score: 101
          - trash_ids:
              - c9eafd50846d299b862ca9bb6ea91950  # x265 / h265 / HEVC
            assign_scores_to:
              - name: "Base Profile"
                score: 1
              - name: "WEB-1080p"
                score: 1
              - name: "WEB-2160p"
                score: 1
              - name: "Remux-1080p - Anime"
                score: 1

    radarr:
      radarr:
        base_url: http://media-radarr.media:7878
        api_key: !file /app/secrets/RADARR_API_KEY
        quality_definition:
          type: anime
        delete_unmanaged_custom_formats:
          enabled: true
        include:
          - template: radarr-quality-definition-anime
          - template: radarr-quality-profile-hd-bluray-web
          - template: radarr-custom-formats-hd-bluray-web
          - template: radarr-quality-profile-uhd-bluray-web
          - template: radarr-custom-formats-uhd-bluray-web
          - template: radarr-quality-profile-remux-web-1080p
          - template: radarr-custom-formats-remux-web-1080p
          - template: radarr-quality-profile-remux-web-2160p
          - template: radarr-custom-formats-remux-web-2160p
          - template: radarr-quality-profile-anime
          - template: radarr-custom-formats-anime
        custom_formats:
          - trash_ids:
              - 4a3b087eea2ce012fcc1ce319259a3be  # Anime Dual Audio
            assign_scores_to:
              - name: "Remux-1080p - Anime"
                score: 2000
          - trash_ids:
              - 4b900e171accbfb172729b63323ea8ca  # MULTi
            assign_scores_to:
              - name: "Remux-1080p - Anime"
                score: 2000
          - trash_ids:
              - cae4ca30163749b891686f95532519bd  # AV1
            assign_scores_to:
              - name: "SD"
                score: 101
              - name: "Ultra-HD"
                score: 101
              - name: "2160p Efficient"
                score: 101
              - name: "Remux 2160p (Alternative)"
                score: 101
              - name: "Remux 2160p (Combined)"
                score: 101
              - name: "HD Bluray + WEB"
                score: 101
              - name: "UHD Bluray + WEB"
                score: 101
              - name: "Remux + WEB 1080p"
                score: 101
              - name: "Remux + WEB 2160p"
                score: 101
              - name: "Remux-1080p - Anime"
                score: 101
          - trash_ids:
              - 9170d55c319f4fe40da8711ba9d8050d  # x265 / h265 / HEVC
            assign_scores_to:
              - name: "SD"
                score: 1
              - name: "Ultra-HD"
                score: 1
              - name: "2160p Efficient"
                score: 1
              - name: "Remux 2160p (Alternative)"
                score: 1
              - name: "Remux 2160p (Combined)"
                score: 1
              - name: "HD Bluray + WEB"
                score: 1
              - name: "UHD Bluray + WEB"
                score: 1
              - name: "Remux + WEB 1080p"
                score: 1
              - name: "Remux + WEB 2160p"
                score: 1
              - name: "Remux-1080p - Anime"
                score: 1
