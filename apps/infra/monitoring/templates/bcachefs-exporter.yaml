# bcachefs pool and per-device metrics from sysfs (scripts/bcachefs-exporter.sh).
# Alpine edge for bcachefs-tools close to the kernel (fs usage), plus
# busybox-extras for httpd. Root reads the sysfs files; SYS_ADMIN is needed
# for the fs usage ioctl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bcachefs-exporter
  namespace: {{ .Release.Namespace }}
data:
  exporter.sh: |
{{ .Files.Get "scripts/bcachefs-exporter.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcachefs-exporter
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: bcachefs-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bcachefs-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bcachefs-exporter }
      annotations:
        checksum/script: {{ .Files.Get "scripts/bcachefs-exporter.sh" | sha256sum }}
    spec:
      containers:
        - name: exporter
          image: {{ .Values.bcachefsExporter.image }}
          command:
            - sh
            - -c
            - apk add --no-cache -q {{ .Values.bcachefsExporter.packages }} && exec sh /etc/bcachefs-exporter/exporter.sh
          env:
            - { name: PORT, value: "9101" }
            - { name: INTERVAL, value: "30" }
            - { name: USAGE_PATH, value: /pool }
          ports:
            - { name: metrics, containerPort: 9101 }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [DAC_READ_SEARCH, SYS_ADMIN] }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: script, mountPath: /etc/bcachefs-exporter, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            # Any path inside the filesystem works for `bcachefs fs usage`.
            - { name: pool, mountPath: /pool, readOnly: true }
      volumes:
        - name: script
          configMap: { name: bcachefs-exporter }
        - name: pool
          hostPath: { path: {{ .Values.bcachefsExporter.poolPath }}, type: Directory }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 4Mi }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: bcachefs-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: bcachefs-exporter }
  podMetricsEndpoints:
    - port: metrics
