{{- range $name, $target := .Values.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
      group: gateway.networking.k8s.io
      kind: Gateway
      # Bind only HTTPS; infra routes otherwise also attach to plaintext HTTP.
      sectionName: {{ required "ingressTargets.*.listener is required" $target.listener }}
  hostnames:
    - {{ $target.host | quote }}
  # Fields spelled out as the API server defaults them, or Argo CD shows a
  # permanent diff.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
          group: ""
          kind: Service
          weight: 1
{{- end }}
