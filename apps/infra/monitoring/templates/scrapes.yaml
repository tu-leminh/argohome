# Extra scrape targets beyond what the stack discovers by itself.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd-application-controller
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: http-metrics
---
# SMART data for every disk (smartctl subchart). Its own ServiceMonitor needs
# the Prometheus Operator CRDs, so scrape it the VictoriaMetrics way.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: smartctl-exporter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      # The subchart alias renames the chart, so its label is "smartctl".
      app.kubernetes.io/name: smartctl
  endpoints:
    - port: http
      interval: 120s
      scrapeTimeout: 60s
