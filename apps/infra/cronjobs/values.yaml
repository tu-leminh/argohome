jobs:
  duckdns-updater:
    runOnStartup: true
    schedule: "*/20 * * * *"
    image: curlimages/curl:latest
    domain: epricesx
    script: |
      #!/bin/sh
      set -ex
      echo url="https://www.duckdns.org/update?domains={{ index .Values.jobs "duckdns-updater" "domain" }}&token=${DUCKDNS_TOKEN}&ip=" | curl -k -o /dev/null -K -
    env:
      - name: DUCKDNS_TOKEN
        valueFrom:
          secretKeyRef:
            name: duckdns-secret
            key: DUCKDNS_TOKEN

  freemyip-updater:
    runOnStartup: true
    schedule: "5-59/20 * * * *"
    image: curlimages/curl:latest
    domain: lmtu.freemyip.com
    script: |
      #!/bin/sh
      set -ex
      curl "https://freemyip.com/update?token=${FREEMYIP_TOKEN}&domain={{ index .Values.jobs "freemyip-updater" "domain" }}"
    env:
      - name: FREEMYIP_TOKEN
        valueFrom:
          secretKeyRef:
            name: freemyip-secret
            key: FREEMYIP_TOKEN

  myaddr-updater:
    runOnStartup: true
    schedule: "10-59/20 * * * *"
    image: curlimages/curl:latest
    script: |
      #!/bin/sh
      set -ex
      curl -X POST "https://myaddr.tools/update?key=${MYADDR_KEY}&ip=self"
    env:
      - name: MYADDR_KEY
        valueFrom:
          secretKeyRef:
            name: myaddr-secret
            key: MYADDR_KEY

  tailscale-cleanup:
    runOnStartup: true
    schedule: "0 4 * * *"
    image: alpine:latest
    script: |
      #!/bin/sh
      set -e
      # Install dependencies
      apk add --no-cache bash curl jq coreutils
      
      # Use bash for the main logic to support pipefail and other bashisms
      /bin/bash <<'EOF'
      set -euf -o pipefail

      if [ -z "$TAILNET" ] || [ -z "$client_id" ] || [ -z "$client_secret" ]; then
        echo "Error: TAILNET, client_id, and client_secret environment variables must be set."
        exit 1
      fi

      echo "Authenticating..."
      TOKEN_RESPONSE=$(curl -s -d "client_id=$client_id" -d "client_secret=$client_secret" -d "grant_type=client_credentials" "https://api.tailscale.com/api/v2/oauth/token")
      ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)

      if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
        echo "Error: Could not obtain access token."
        exit 1
      fi

      CUTOFF_DATE=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
      echo "Fetching devices for tailnet: $TAILNET"
      echo "Removing devices last seen before: $CUTOFF_DATE"

      DEVICES=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" "https://api.tailscale.com/api/v2/tailnet/$TAILNET/devices")

      # Iterate and delete
      echo "$DEVICES" | jq -r --arg CUTOFF_DATE "$CUTOFF_DATE" '.devices[] | select(.lastSeen < $CUTOFF_DATE) | .id' | while read -r DEVICE_ID; do
        echo "Removing device ${DEVICE_ID}"
        curl -s -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "https://api.tailscale.com/api/v2/device/${DEVICE_ID}"
      done
      echo "Cleanup complete."
      EOF
    env:
      - name: TAILNET
        valueFrom:
          secretKeyRef:
            name: tailscale-secret
            key: TAILNET
      - name: client_id
        valueFrom:
          secretKeyRef:
            name: tailscale-secret
            key: client_id
      - name: client_secret
        valueFrom:
          secretKeyRef:
            name: tailscale-secret
            key: client_secret

  perm-fixer:
    runOnStartup: true
    schedule: "0 * * * *"
    image: alpine:latest
    script: |
      #!/bin/sh
      echo "Fixing permissions on /data..."
      # Set ownership to User 1000 (Host/Media/Traefik standard)
      chown -R 1000:1000 /data
      
      # Secure Traefik ACME files (Must be 600)
      TRAEFIK_DATA_PATH="/data/apps/infra/traefik/config"
      echo "Securing ACME storage at ${TRAEFIK_DATA_PATH}..."
      if ls ${TRAEFIK_DATA_PATH}/*.json 1> /dev/null 2>&1; then
        # Ensure owner is 1000 (redundant but safe)
        chown 1000:1000 ${TRAEFIK_DATA_PATH}/*.json
        # Strictly restrict to owner-only
        chmod 600 ${TRAEFIK_DATA_PATH}/*.json
      fi
      
      echo "Done."
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    volumes:
      - name: data-volume
        hostPath:
          path: /data
          type: Directory
    volumeMounts:
      - name: data-volume
        mountPath: /data
