jobs:
  duckdns-updater:
    runOnStartup: true
    schedule: "*/20 * * * *"
    image: curlimages/curl:latest
    domain: epricesx
    script: |
      #!/bin/sh
      set -ex
      echo url="https://www.duckdns.org/update?domains={{ index .Values.jobs "duckdns-updater" "domain" }}&token=${DUCKDNS_TOKEN}&ip=" | curl -k -o /dev/null -K -
    env:
      - name: DUCKDNS_TOKEN
        valueFrom:
          secretKeyRef:
            name: duckdns-secret
            key: DUCKDNS_TOKEN

  freemyip-updater:
    runOnStartup: true
    schedule: "5-59/20 * * * *"
    image: curlimages/curl:latest
    domain: lmtu.freemyip.com
    script: |
      #!/bin/sh
      set -ex
      curl "https://freemyip.com/update?token=${FREEMYIP_TOKEN}&domain={{ index .Values.jobs "freemyip-updater" "domain" }}"
    env:
      - name: FREEMYIP_TOKEN
        valueFrom:
          secretKeyRef:
            name: freemyip-secret
            key: FREEMYIP_TOKEN

  myaddr-updater:
    runOnStartup: true
    schedule: "10-59/20 * * * *"
    image: curlimages/curl:latest
    script: |
      #!/bin/sh
      set -ex
      curl -X POST "https://myaddr.tools/update?key=${MYADDR_KEY}&ip=self"
    env:
      - name: MYADDR_KEY
        valueFrom:
          secretKeyRef:
            name: myaddr-secret
            key: MYADDR_KEY

  perm-fixer:
    runOnStartup: true
    schedule: "0 * * * *"
    image: alpine:latest
    script: |
      #!/bin/sh
      echo "Fixing permissions on /data..."
      # Set ownership to User 1000 (Host/Media/Traefik standard)
      chown -R 1000:1000 /data
      
      # Secure Traefik ACME files (Must be 600)
      echo "Securing ACME storage..."
      if ls /data/config/traefik/*.json 1> /dev/null 2>&1; then
        # Ensure owner is 1000 (redundant but safe)
        chown 1000:1000 /data/config/traefik/*.json
        # Strictly restrict to owner-only
        chmod 600 /data/config/traefik/*.json
      fi
      
      echo "Done."
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    volumes:
      - name: data-volume
        hostPath:
          path: /data
          type: Directory
    volumeMounts:
      - name: data-volume
        mountPath: /data
