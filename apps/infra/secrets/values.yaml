# Secrets synced from OpenBao (KV v2 mount `secret/`, path below) by External
# Secrets through the `openbao` ClusterSecretStore (apps/infra/external-secrets).
# Values live only in OpenBao; to rotate one, write it there with an admin login
# (see apps/infra/openbao/README.md) and it syncs within `refreshInterval`.
refreshInterval: 1h
targetNamespace: infra

secrets:
  duckdns-secret: homelab/duckdns
  freemyip-secret: homelab/freemyip
  myaddr-secret: homelab/myaddr
  tailscale-secret: homelab/tailscale
