{{- range $name, $path := .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.targetNamespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $path }}
{{- end }}
