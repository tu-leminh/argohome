apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
    spec:
      # The app runs as root without CAP_DAC_OVERRIDE, so its config dir must be
      # owned by root (the hostPath may already exist owned by 1000).
      initContainers:
        - name: fix-perms
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /config/work /config/conf && chown -R 0:0 /config"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: adguard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          # AdGuard refuses its first launch unless it runs as root ("you must run
          # it as administrator"), even with the unprivileged-port sysctl, so it
          # runs as root but with every capability dropped except binding <1024.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: http, containerPort: 80, protocol: TCP }
            - { name: setup, containerPort: 3000, protocol: TCP }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: config
              mountPath: /opt/adguardhome/conf
              subPath: conf
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
