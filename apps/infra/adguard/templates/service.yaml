apiVersion: v1
kind: Service
metadata:
  name: adguard
  labels:
    app.kubernetes.io/name: adguard
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  externalTrafficPolicy: Local
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
    - { name: http, port: 80, targetPort: http, protocol: TCP }
    # First-run setup wizard only; harmless afterwards.
    - { name: setup, port: 3000, targetPort: setup, protocol: TCP }
  selector:
    app.kubernetes.io/name: adguard
