apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # The Disks group (templates/_disks.tpl) goes right after Monitoring.
  services.yaml: |
    {{- $services := .Values.config.services }}
    {{- $disks := dict "Disks" (include "homepage.diskTiles" . | fromYamlArray) }}
    {{- toYaml (concat (list (first $services)) (list $disks) (rest $services)) | nindent 4 }}
  widgets.yaml: |
    {{- toYaml .Values.config.widgets | nindent 4 }}
  settings.yaml: |
    {{- toYaml .Values.config.settings | nindent 4 }}
