image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  loadBalancerIP: 10.0.1.4
  port: 80

# `listener` is the Gateway's HTTPS listener for that host. It must be set:
# routes in the infra namespace would otherwise also attach to the plaintext
# HTTP listener and serve the page unencrypted instead of redirecting.
ingressTargets:
  myaddr:
    host: lmtlmt.myaddr.io
    listener: myaddr
  duckdns:
    host: epricesx.duckdns.org
    listener: duckdns-apex
  freemyip:
    host: lmtu.freemyip.com
    listener: freemyip-apex

# Homepage Configuration
config:
  services:
    # Live tiles queried from VictoriaMetrics (apps/infra/monitoring); click
    # through to Grafana for history.
    - Monitoring:
        - Homelab:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/grafana.png
            href: https://grafana.epricesx.duckdns.org
            description: Node
            widget:
              type: prometheusmetric
              url: http://vmsingle-vm.infra.svc:8428
              refreshInterval: 15000
              metrics:
                - label: CPU
                  query: 100 * sum(rate(node_cpu_seconds_total{mode!~"idle|iowait|steal"}[5m])) / count(node_cpu_seconds_total{mode="idle"})
                  format: { type: percent, options: { maximumFractionDigits: 0 } }
                - label: RAM
                  query: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                  format: { type: percent, options: { maximumFractionDigits: 0 } }
                - label: Disk free
                  query: node_filesystem_avail_bytes{mountpoint="/"}
                  format: { type: bbytes }
                - label: Pods down
                  query: sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)
                  format: { type: number }
        - Pool & disks:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/smart-tool.png
            href: https://grafana.epricesx.duckdns.org/d/bcachefs
            description: bcachefs + SMART
            widget:
              type: prometheusmetric
              url: http://vmsingle-vm.infra.svc:8428
              refreshInterval: 60000
              metrics:
                - label: IO errors
                  query: sum(bcachefs_device_io_errors_total) or vector(0)
                  format: { type: number }
                - label: Disks not rw
                  query: count(bcachefs_device_state{state!="rw"} == 1) or vector(0)
                  format: { type: number }
                - label: SMART failing
                  query: count(smartctl_device_smart_status != 1) or vector(0)
                  format: { type: number }
                - label: Hottest
                  query: max(smartctl_device_temperature{temperature_type="current"})
                  format: { type: number, suffix: "°C" }
        - Backup & alerts:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/cloudflare.png
            href: https://grafana.epricesx.duckdns.org/alerting/list
            description: R2 backup, firing alerts
            widget:
              type: prometheusmetric
              url: http://vmsingle-vm.infra.svc:8428
              refreshInterval: 60000
              metrics:
                - label: Last backup
                  query: time() - max(kube_cronjob_status_last_successful_time{cronjob="r2-backup"})
                  format: { type: duration }
                - label: Bucket
                  query: max(r2_backup_bucket_bytes)
                  format: { type: bytes }
                - label: Alerts
                  query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
                  format: { type: number }

    - Infrastructure:
        - Argo CD:
            # Verified: "argo-cd.png" is the correct filename in the main branch
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/argo-cd.png
            href: https://argo.lmtlmt.myaddr.io
            description: GitOps Deployment

    - Cloud:
        - Vaultwarden:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/vaultwarden.png
            href: https://vault.epricesx.duckdns.org
            description: Password Vault
        - SFTPGo:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/sftpgo.png
            href: https://file.lmtlmt.myaddr.io
            description: SFTP / WebDAV Server

    - Media:
        - Jellyfin:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/jellyfin.png
            href: https://jellyfin.lmtlmt.myaddr.io
            description: Media Server
        - Seerr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/overseerr.png
            href: https://seerr.lmtlmt.myaddr.io
            description: Media Requests
        - Sonarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/sonarr.png
            href: https://sonarr.lmtlmt.myaddr.io
            description: TV Shows
        - Radarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/radarr.png
            href: https://radarr.lmtlmt.myaddr.io
            description: Movies
        - Prowlarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/prowlarr.png
            href: https://prowlarr.lmtlmt.myaddr.io
            description: Indexer Manager
        - Lidarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/lidarr.png
            href: https://lidarr.lmtlmt.myaddr.io
            description: Music
        - Slskd:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/soulseek.png
            href: https://slskd.lmtlmt.myaddr.io
            description: Soulseek Daemon
        - Q1:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q1.lmtlmt.myaddr.io
            description: Torrent Client
        - Q2:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q2.lmtlmt.myaddr.io
            description: Torrent Client
        - Q3:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q3.lmtlmt.myaddr.io
            description: Torrent Client
        - Bazarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/bazarr.png
            href: https://bazarr.lmtlmt.myaddr.io
            description: Subtitles Manager
        - Autobrr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/autobrr.png
            href: https://autobrr.lmtlmt.myaddr.io
            description: Torrent Automation
        - Qui:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/autobrr.png
            href: https://qui.lmtlmt.myaddr.io
            description: Autobrr GUI
        - Profilarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/profilarr.png
            href: https://profilarr.lmtlmt.myaddr.io
            description: Quality Profiles

  widgets: []

  settings:
    title: Home Lab
    theme: dark
    color: slate
    cardBlur: sm
    layout:
      Infrastructure:
        style: row
        columns: 3
      Cloud:
        style: row
        columns: 3
      Media:
        style: row
        columns: 6

    # BACKGROUND IMAGE CONFIGURATION
    background:
      # Option 1: Minimal Saturn (Active) - Matches Macchiato Palette
      image: https://raw.githubusercontent.com/iruzo/wp/main/desktop-catppuccin-macchiato-saturn.jpg
      
      # Option 2: Paint Swirl (Uncomment to use)
      # image: https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/main/abstract/paint-swirl-macchiato.png
      
      # Option 3: Minimal Mountains (Uncomment to use)
      # image: https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/main/landscapes/mountains_macchiato.png
      
      opacity: 0.8 # Dim the background slightly so text pops

    # CSS to force the correct Macchiato Colors on cards and text
    customssh: |
      :root {
        --ctp-macchiato-base: #24273a;
        --ctp-macchiato-mantle: #1e2030;
        --ctp-macchiato-crust: #181926;
        --ctp-macchiato-text: #cad3f5;
        --ctp-macchiato-surface0: #363a4f;
      }
      /* Apply transparent dark background to cards so wallpaper shows through slightly */
      .services .service {
        background: rgba(54, 58, 79, 0.85) !important; /* Macchiato Surface0 with opacity */
        border: 1px solid var(--ctp-macchiato-mantle);
        backdrop-filter: blur(5px);
      }
      .service-name {
        color: var(--ctp-macchiato-text) !important;
      }
      .service-desc {
        color: #a5adcb !important;
      }