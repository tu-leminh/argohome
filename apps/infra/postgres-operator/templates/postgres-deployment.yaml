apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: infra
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          value: nextcloudpassword
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - nextcloud
            - -d
            - nextcloud
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - nextcloud
            - -d
            - nextcloud
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: infra
  labels:
    app: postgresql
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresql
  type: ClusterIP