apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.addresses.ipv4 | quote }}
    - type: IPAddress
      value: {{ .Values.gateway.addresses.ipv6 | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- range $name, $cert := .Values.certs }}
    {{- if $cert.wildcard }}
    - name: {{ $name }}-wildcard
      protocol: HTTPS
      port: 443
      hostname: {{ $cert.wildcard | quote }}
      tls:
        certificateRefs:
          - name: {{ $cert.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ $name }}-apex
      protocol: HTTPS
      port: 443
      hostname: {{ $cert.apex | quote }}
      tls:
        certificateRefs:
          - name: {{ $cert.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- else }}
    - name: {{ $name }}
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - name: {{ $cert.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
    {{- end }}
