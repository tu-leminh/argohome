{{- range $name, $target := .Values.ingressTargets }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ $target.host }}`){{- if $target.path }} && PathPrefix(`{{ $target.path }}`){{- end }} && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    kind: Rule
    services:
    - name: api@internal
      kind: TraefikService
  tls:
    {{- if $target.certResolver }}
    certResolver: {{ $target.certResolver }}
    {{- else }}
    {}
    {{- end }}
{{- end }}