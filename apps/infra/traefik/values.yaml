traefik:
  service:
    enabled: true
    single: true
    type: LoadBalancer
    spec:
      loadBalancerIP: "192.168.1.111"
  persistence:
    enabled: true
    size: 1Gi
    path: /data
  envFrom:
    - secretRef:
        name: duckdns-secret
    - secretRef:
        name: freemyip-secret
    - secretRef:
        name: myaddr-secret
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
      publishedService:
        enabled: true
  additionalArguments:
    # --- LetsEncrypt (DuckDNS) Resolver ---
    - "--certificatesresolvers.letsencrypt.acme.storage=/data/duckdns.json"
    - "--certificatesresolvers.letsencrypt.acme.email=mt.the.dev@gmail.com"
    - "--certificatesresolvers.letsencrypt.acme.dnsChallenge.provider=duckdns"
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.disableChecks=true"
    
    # --- FreeMyIP Resolver ---
    - "--certificatesresolvers.freemyip.acme.storage=/data/freemyip.json"
    - "--certificatesresolvers.freemyip.acme.email=mt.the.dev@gmail.com"
    - "--certificatesresolvers.freemyip.acme.dnsChallenge.provider=freemyip"
    - "--certificatesresolvers.freemyip.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    - "--certificatesresolvers.freemyip.acme.dnschallenge.propagation.disableChecks=true"

    # --- MyAddr Resolver ---
    - "--certificatesresolvers.myaddr.acme.storage=/data/myaddr.json"
    - "--certificatesresolvers.myaddr.acme.email=mt.the.dev@gmail.com"
    - "--certificatesresolvers.myaddr.acme.dnsChallenge.provider=myaddr"
    - "--certificatesresolvers.myaddr.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    - "--certificatesresolvers.myaddr.acme.dnschallenge.propagation.disableChecks=true"

  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      http:
        tls:
          enabled: true
          certResolver: letsencrypt
          domains:
            - main: epricesx.duckdns.org
              sans: ["*.epricesx.duckdns.org"]