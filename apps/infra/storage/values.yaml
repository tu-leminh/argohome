nodeName: "dell"
mounts:
  # Media Volumes (Shared)
  - name: media-shared-downloads
    path: /data/shared/downloads
    size: 500Gi
    accessMode: ReadWriteMany
  - name: media-shared-movies
    path: /data/shared/movies
    size: 500Gi
    accessMode: ReadWriteMany
  - name: media-shared-shows
    path: /data/shared/shows
    size: 500Gi
    accessMode: ReadWriteMany

  # App Configs (Media)
  - name: media-sonarr-config
    path: /data/configs/sonarr
    size: 1Gi
  - name: media-radarr-config
    path: /data/configs/radarr
    size: 1Gi
  - name: media-jellyfin-config
    path: /data/configs/jellyfin
    size: 100Gi
  - name: media-prowlarr-config
    path: /data/configs/prowlarr
    size: 1Gi
  - name: media-bazarr-config
    path: /data/configs/bazarr
    size: 1Gi
  - name: media-autobrr-config
    path: /data/configs/autobrr
    size: 1Gi
  - name: media-q1-config
    path: /data/configs/q1
    size: 1Gi
  - name: media-q2-config
    path: /data/configs/q2
    size: 1Gi
  - name: media-q3-config
    path: /data/configs/q3
    size: 1Gi
  - name: media-seerr-config
    path: /data/configs/seerr
    size: 1Gi
  - name: media-qui-config
    path: /data/configs/qui
    size: 1Gi
  - name: media-profilarr-config
    path: /data/configs/profilarr
    size: 1Gi
  - name: media-upload-assistant-config
    path: /data/configs/upload-assistant
    size: 2Gi

  # SFTPGo (data PV exposes /data over SFTP and WebDAV)
  - name: media-sftpgo-config
    path: /data/configs/sftpgo
    size: 1Gi
  - name: media-filebrowser-data
    path: /data
    size: 1000Gi
    accessMode: ReadWriteMany

  # Infrastructure
  - name: infra-traefik-config
    namespace: infra
    path: /data/configs/traefik
    size: 1Gi