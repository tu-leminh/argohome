nodeName: "homelab"
mounts:
  # Media Volumes (Shared) - one PV/PVC over all of tier3 instead of one
  # per media type, so every app mounts the same claim at /data, seeing
  # /data/{downloads,movies,shows,music} directly underneath.
  - name: media-shared-data
    path: /data/tier3
    size: 2000Gi
    accessMode: ReadWriteMany

  # App Configs (Media)
  - name: media-sonarr-config
    path: /data/tier2/configs/sonarr
    size: 1Gi
  - name: media-radarr-config
    path: /data/tier2/configs/radarr
    size: 1Gi
  - name: media-lidarr-config
    path: /data/tier2/configs/lidarr
    size: 1Gi
  - name: media-slskd-config
    path: /data/tier2/configs/slskd
    size: 1Gi
  - name: media-jellyfin-config
    path: /data/tier2/configs/jellyfin
    size: 100Gi
  - name: media-prowlarr-config
    path: /data/tier2/configs/prowlarr
    size: 1Gi
  - name: media-bazarr-config
    path: /data/tier2/configs/bazarr
    size: 1Gi
  - name: media-autobrr-config
    path: /data/tier2/configs/autobrr
    size: 1Gi
  - name: media-q1-config
    path: /data/tier2/configs/q1
    size: 1Gi
  - name: media-q2-config
    path: /data/tier2/configs/q2
    size: 1Gi
  - name: media-q3-config
    path: /data/tier2/configs/q3
    size: 1Gi
  - name: media-seerr-config
    path: /data/tier2/configs/seerr
    size: 1Gi
  - name: media-qui-config
    path: /data/tier2/configs/qui
    size: 1Gi
  - name: media-upbrr-config
    path: /data/tier2/configs/upbrr
    size: 2Gi

  # SFTPGo (data PV exposes /data over SFTP and WebDAV)
  - name: media-sftpgo-config
    path: /data/tier2/configs/sftpgo
    size: 1Gi
  - name: media-filebrowser-data
    path: /data
    size: 1000Gi
    accessMode: ReadWriteMany

  # Infrastructure
  - name: infra-traefik-config
    namespace: infra
    path: /data/tier2/configs/traefik
    size: 1Gi
  - name: infra-configarr-repos
    namespace: infra
    path: /data/tier2/configs/configarr-repos
    size: 2Gi
  # Read-only mirrors of the media-namespace Sonarr/Radarr config PVs, so the
  # configarr job (infra namespace) can extract api_key from config.xml
  # without a hardcoded secret. PVCs are namespace-scoped, so this can't just
  # mount the media-sonarr-config-pvc/media-radarr-config-pvc directly.
  - name: infra-sonarr-config-ro
    namespace: infra
    path: /data/tier2/configs/sonarr
    size: 1Gi
    accessMode: ReadOnlyMany
  - name: infra-radarr-config-ro
    namespace: infra
    path: /data/tier2/configs/radarr
    size: 1Gi
    accessMode: ReadOnlyMany