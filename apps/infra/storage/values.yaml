nodeName: "dell"
mounts:
  # Media Volumes (Default namespace: media)
  - name: downloads
    path: /data/media/downloads
    size: 500Gi
    accessMode: ReadWriteMany
  - name: movies
    path: /data/media/movies
    size: 500Gi
    accessMode: ReadWriteMany
  - name: shows
    path: /data/media/tv
    size: 500Gi
    accessMode: ReadWriteMany
  # App Configs (Media)
  - name: sonarr-config
    path: /data/config/sonarr
    size: 1Gi
  - name: radarr-config
    path: /data/config/radarr
    size: 1Gi
  - name: qbittorrent-config
    path: /data/config/qbittorrent
    size: 1Gi
  - name: jellyfin-config
    path: /data/config/jellyfin
    size: 100Gi
  - name: prowlarr-config
    path: /data/config/prowlarr
    size: 1Gi

  # Nextcloud
  - name: nextcloud-config
    namespace: nextcloud
    path: /data/config/nextcloud
    size: 1Gi
  - name: nextcloud-data
    namespace: nextcloud
    path: /data/nextcloud
    size: 500Gi
    accessMode: ReadWriteMany

  # PostgreSQL
  - name: postgresql-data
    namespace: infra
    path: /data/database/postgresql
    size: 8Gi

  # Infrastructure
  - name: traefik-data
    namespace: infra
    path: /data/config/traefik
    size: 1Gi

statefulSetMounts:
  # PostgreSQL StatefulSet - keeping for backward compatibility
  - pvName: postgresql-infra-postgresql-0-pv
    path: /data/database/postgresql
    size: 8Gi

# Update the nextcloud PVC to be in the correct namespace
# Remove the nextcloud-config entry from the mounts section above and handle it here if needed
