# Manual-only cleanup. Disabled by default (values.yaml: cleanupJob.enabled=false).
# Enable via Argo UI → infra-tailscale → Details → Parameters → cleanupJob.enabled=true → Sync,
# or: argocd app set infra-tailscale --helm-set cleanupJob.enabled=true (then Sync).
# When enabled, runs as Sync hook (wave 100, after operator/ingresses) and wipes
# operator-managed proxy devices (tag:k8s) from the tailnet — even if still online —
# so the operator re-registers fresh ones on next reconcile. Operator device
# (tag:k8s-operator) is NOT touched: deleting it forces interactive re-login and
# breaks auth key issuance (see a63d9e4). When disabled (default), the Job is not
# rendered at all, so operator recreates/rollouts do NOT delete healthy proxies.
{{- if .Values.cleanupJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: tailscale-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "100"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: alpine:3.20
          envFrom:
            - secretRef:
                name: tailscale-secret
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              apk add --no-cache curl jq >/dev/null

              echo "Authenticating to Tailscale API..."
              TOKEN=$(curl -sf \
                -d "client_id=$client_id" \
                -d "client_secret=$client_secret" \
                -d "grant_type=client_credentials" \
                https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)

              echo "Removing proxy devices (tag:k8s) from $TAILNET..."
              echo "  (removes matching devices even if still online — operator re-registers them)"
              curl -sf -H "Authorization: Bearer $TOKEN" \
                "https://api.tailscale.com/api/v2/tailnet/$TAILNET/devices" \
                | jq -r '.devices[] | select((.tags // []) | any(. == "tag:k8s")) | .id' \
                | while read -r id; do
                    echo "  removing $id"
                    curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                      "https://api.tailscale.com/api/v2/device/$id" \
                      || echo "  warning: failed to remove $id, continuing"
                  done
              echo "Cleanup complete."
{{- end }}
