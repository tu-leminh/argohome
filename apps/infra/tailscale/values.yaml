tailscale-operator:
  oauthSecretVolume:
    secret:
      secretName: tailscale-secret
  operatorConfig:
    logging: "info"

ingresses:
  - name: argocd
    namespace: infra
    serviceName: infra-argocd-server
    port: 80 # argocd-server now genuinely serves plaintext HTTP (server.insecure)
    host: argo
  - name: homepage
    namespace: infra
    serviceName: homepage
    port: 80
    host: homepage
  - name: autobrr
    namespace: media
    serviceName: media-autobrr
    port: 80
    host: autobrr
  - name: bazarr
    namespace: media
    serviceName: media-bazarr
    port: 80
    host: bazarr
  - name: sftpgo
    namespace: media
    serviceName: media-sftpgo
    port: 8080
    host: file
  - name: webdav
    namespace: media
    serviceName: media-sftpgo
    port: 10080
