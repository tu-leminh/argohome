apiVersion: v1
kind: ServiceAccount
metadata:
  name: lego
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lego-secret-writer
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lego-secret-writer
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: lego
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: lego-secret-writer
  apiGroup: rbac.authorization.k8s.io
