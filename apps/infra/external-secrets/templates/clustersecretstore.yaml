apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    # The CRDs ship in the same sync; apply this after them and don't fail the
    # dry run while they don't exist yet.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.authMount | quote }}
          role: {{ .Values.openbao.role | quote }}
          serviceAccountRef:
            name: {{ index .Values "external-secrets" "serviceAccount" "name" }}
            namespace: {{ .Release.Namespace }}
