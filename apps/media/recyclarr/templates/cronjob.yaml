apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # Enforce UID 1000 per your cluster rules
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: recyclarr
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              env:
                - name: DOTNET_USE_POLLING_FILE_WATCHER
                  value: "true"
              command:
                - /bin/sh
                - -c
                - |
                  export SONARR_API_KEY=$(grep -m1 ApiKey /sonarr-config.xml | sed 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/')
                  export RADARR_API_KEY=$(grep -m1 ApiKey /radarr-config.xml | sed 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/')
                  echo "Dynamically fetched API keys for Sonarr and Radarr."
                  exec recyclarr sync
              volumeMounts:
                - name: config
                  mountPath: /config
                # Mount the ConfigMap specifically as a file, leaving the rest of /config writable
                - name: recyclarr-yml
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                - name: sonarr-config
                  mountPath: /sonarr-config.xml
                  subPath: config.xml
                  readOnly: true
                - name: radarr-config
                  mountPath: /radarr-config.xml
                  subPath: config.xml
                  readOnly: true
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: media-recyclarr-config-pvc
            - name: recyclarr-yml
              configMap:
                name: recyclarr-config
            - name: sonarr-config
              persistentVolumeClaim:
                claimName: media-sonarr-config-pvc
                readOnly: true
            - name: radarr-config
              persistentVolumeClaim:
                claimName: media-radarr-config-pvc
                readOnly: true
