uploadAssistant:
  image:
    repository: ghcr.io/audionut/upload-assistant
    tag: latest
    pullPolicy: Always

  # Enforce non-root execution (UID 1000)
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  env:
    TZ: Etc/UTC
    # Comma-separated list of container paths to browse
    UA_BROWSE_ROOTS: /downloads,/BT_backup/q1,/BT_backup/q2,/BT_backup/q3,/Upload-Assistant/tmp
    IN_DOCKER: "1"

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.168
    port: 5000

  persistence:
    config:
      enabled: true
      existingClaim: media-upload-assistant-config-pvc
    downloads:
      enabled: true
      existingClaim: media-shared-downloads-pvc

  # Client configurations to mount read-only for access to torrent BT_backup folders
  clients:
    - name: q1
      claimName: media-q1-config-pvc
    - name: q2
      claimName: media-q2-config-pvc
    - name: q3
      claimName: media-q3-config-pvc

  ingressTargets:
    duckdns:
      host: upload.epricesx.duckdns.org
      certResolver: letsencrypt
