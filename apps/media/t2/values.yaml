transmission:
  image:
    repository: lscr.io/linuxserver/transmission
    tag: latest
    pullPolicy: IfNotPresent
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000
    USER: ''
    PASS: ''
  service:
    type: ClusterIP
    port: 9091
  persistence:
    config:
      enabled: true
      existingClaim: media-t2-config-pvc
    downloads:
      enabled: true
      existingClaim: media-shared-downloads-pvc
      mountPath: /downloads
  ingressTargets:
    duckdns:
      host: t2.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: t2.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: '*.lmtu.freemyip.com'
      tlsSans:
      - lmtu.freemyip.com
    myaddr:
      host: lmtlmt.myaddr.io
      path: /t2
      certResolver: myaddr
