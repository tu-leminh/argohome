qbittorrent:
  image:
    repository: lscr.io/linuxserver/qbittorrent
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.164
    port: 8080

  persistence:
    config:
      enabled: true
      existingClaim: media-qbittorrent-config-pvc
    downloads:
      enabled: true
      existingClaim: media-shared-downloads-pvc
      mountPath: /downloads

  ingressTargets:
    duckdns:
      host: qbittorrent.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: qbittorrent.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: qbittorrent.lmtlmt.myaddr.io
      certResolver: myaddr
