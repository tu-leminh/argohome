jellyfin:
  image:
    repository: lscr.io/linuxserver/jellyfin
    tag: latest
    pullPolicy: Always
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000
  
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.154
    port: 8096

  persistence:
    config:
      enabled: true
      existingClaim: media-jellyfin-config-pvc
    data:
      enabled: true
      existingClaim: media-shared-data-pvc
      mountPath: /data

  # AMD GPU passthrough for VAAPI hardware transcoding (amdgpu + Mesa on the
  # host - renderD128 is world-writable, so no securityContext/GID matching
  # needed). Set VA-API device = /dev/dri/renderD128 in Jellyfin's own
  # Admin > Playback > Transcoding settings after this is deployed.
  gpu:
    enabled: true
    devicePath: /dev/dri

  ingressTargets:
    duckdns:
      host: jellyfin.epricesx.duckdns.org
    freemyip:
      host: jellyfin.lmtu.freemyip.com
    myaddr:
      host: jellyfin.lmtlmt.myaddr.io
