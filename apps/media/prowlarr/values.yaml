prowlarr:
  image:
    repository: lscr.io/linuxserver/prowlarr
    tag: latest
    pullPolicy: IfNotPresent
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000
  
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.152
    port: 9696

  persistence:
    config:
      enabled: true
      existingClaim: media-prowlarr-config-pvc
  
  ingressTargets:
    duckdns:
      host: prowlarr.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: prowlarr.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: lmtlmt.myaddr.io
      path: /prowlarr
      certResolver: myaddr