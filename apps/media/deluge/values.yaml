deluge:
  image:
    repository: lscr.io/linuxserver/deluge
    tag: latest
    pullPolicy: IfNotPresent
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000
    DELUGE_LOGLEVEL: info
  
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.156
    port: 8112

  persistence:
    config:
      enabled: true
      existingClaim: media-deluge-config-pvc
    downloads:
      enabled: true
      existingClaim: media-shared-downloads-pvc
      mountPath: /downloads
  
  ingressTargets:
    duckdns:
      host: deluge.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: deluge.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: lmtlmt.myaddr.io
      path: /deluge
      certResolver: myaddr
