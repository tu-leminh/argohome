apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.selector" . | nindent 8 }}
    spec:
      containers:
        - name: transmission
          image: "{{ .Values.transmission.image.repository }}:{{ .Values.transmission.image.tag }}"
          imagePullPolicy: {{ .Values.transmission.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.transmission.service.port }}
              protocol: TCP
            - name: torrent-tcp
              containerPort: 51413
              protocol: TCP
            - name: torrent-udp
              containerPort: 51413
              protocol: UDP
          
          env:
            {{- range $key, $value := .Values.transmission.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          
          volumeMounts:
            {{- if .Values.transmission.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- if .Values.transmission.persistence.downloads.enabled }}
            - name: downloads
              mountPath: {{ .Values.transmission.persistence.downloads.mountPath }}
            {{- end }}
      
      volumes:
        {{- if .Values.transmission.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.transmission.persistence.config.existingClaim }}
        {{- end }}
        {{- if .Values.transmission.persistence.downloads.enabled }}
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ .Values.transmission.persistence.downloads.existingClaim }}
        {{- end }}
