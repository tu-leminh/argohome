sonarr:
  image:
    repository: lscr.io/linuxserver/sonarr
    tag: latest
    pullPolicy: Always
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.150
    port: 8989
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000

  ingressTargets:
    duckdns:
      host: sonarr.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: sonarr.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: sonarr.lmtlmt.myaddr.io
      certResolver: myaddr

  persistence:
    config:
      enabled: true
      existingClaim: media-sonarr-config-pvc
    data:
      enabled: true
      existingClaim: media-shared-data-pvc
      mountPath: /data
