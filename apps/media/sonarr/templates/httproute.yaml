{{- range $name, $target := .Values.sonarr.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
  hostnames:
    - "{{ $target.host }}"
  rules:
    - backendRefs:
        - name: {{ $.Release.Name }}
          port: 8989
{{- end }}
