{{- range $name, $target := .Values.sonarr.ingressTargets }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ $target.host }}`)
    kind: Rule
    services:
    - name: sonarr
      port: 8989
  tls:
    certResolver: {{ $target.certResolver }}
    domains:
    - main: {{ $target.host }}
{{- end }}
