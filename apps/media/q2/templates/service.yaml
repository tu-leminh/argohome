apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.q2.service.type | default "ClusterIP" }}
  {{- if .Values.q2.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.q2.service.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.q2.service.port }}
      targetPort: webui
      protocol: TCP
      name: webui
  selector:
    {{- include "common.labels.selector" . | nindent 4 }}
{{- if .Values.q2.torrentService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-torrent
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.q2.torrentService.type | default "NodePort" }}
  ports:
    - port: {{ .Values.q2.torrentService.port }}
      targetPort: torrent-tcp
      protocol: TCP
      name: torrent-tcp
      nodePort: {{ .Values.q2.torrentService.port }}
    - port: {{ .Values.q2.torrentService.port }}
      targetPort: torrent-udp
      protocol: UDP
      name: torrent-udp
      nodePort: {{ .Values.q2.torrentService.port }}
  selector:
    {{- include "common.labels.selector" . | nindent 4 }}
{{- end }}
