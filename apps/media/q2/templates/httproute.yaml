{{- range $name, $target := .Values.q2.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: q2-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
  hostnames:
    - "{{ $target.host }}"
  rules:
    - backendRefs:
        - name: {{ include "common.names.fullname" $ }}
          port: {{ $.Values.q2.service.port }}
{{- end }}
