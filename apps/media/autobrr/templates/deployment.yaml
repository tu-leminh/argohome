apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.selector" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # fsGroup is ignored on hostPath PVs, so chown /config as root first.
      initContainers:
        - name: fix-perms
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: autobrr
          image: "{{ .Values.autobrr.image.repository }}:{{ .Values.autobrr.image.tag }}"
          imagePullPolicy: {{ .Values.autobrr.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.autobrr.service.containerPort }}
              protocol: TCP
              
          env:
            {{- range $key, $value := .Values.autobrr.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          
          volumeMounts:
            {{- if .Values.autobrr.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
      
      volumes:
        {{- if .Values.autobrr.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.autobrr.persistence.config.existingClaim }}
        {{- end }}