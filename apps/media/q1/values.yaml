q1:
  image:
    repository: lscr.io/linuxserver/qbittorrent
    tag: latest
    pullPolicy: Always

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.164
    port: 8080

  persistence:
    config:
      enabled: true
      existingClaim: media-q1-config-pvc
    data:
      enabled: true
      existingClaim: media-shared-data-pvc
      mountPath: /data

  ingressTargets:
    duckdns:
      host: q1.epricesx.duckdns.org
    freemyip:
      host: q1.lmtu.freemyip.com
    myaddr:
      host: q1.lmtlmt.myaddr.io
