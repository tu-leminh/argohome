filebrowser:
  image:
    repository: gtstef/filebrowser
    tag: latest
    pullPolicy: Always

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.159
    port: 80

  containerPort: 8080

  persistence:
    config:
      enabled: true
      existingClaim: media-filebrowser-config-pvc
    data:
      enabled: true
      existingClaim: media-filebrowser-data-pvc
      mountPath: /data

  # Rendered into /home/filebrowser/data/config.yaml via ConfigMap subPath
  config:
    server:
      port: 8080
      sources:
        - path: "/data"
          config:
            defaultEnabled: true
    auth:
      adminUsername: admin

  ingressTargets:
    duckdns:
      host: files.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: files.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: files.lmtlmt.myaddr.io
      certResolver: myaddr
