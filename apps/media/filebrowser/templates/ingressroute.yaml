{{- range $name, $target := .Values.filebrowser.ingressTargets }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ $target.host }}`)
    kind: Rule
    services:
    - name: {{ include "common.names.fullname" $ }}
      port: {{ $.Values.filebrowser.service.port }}
  tls:
    certResolver: {{ $target.certResolver }}
    {{- if $target.tlsDomain }}
    domains:
    - main: "{{ $target.tlsDomain }}"
      {{- if $target.tlsSans }}
      sans:
        {{- range $target.tlsSans }}
        - "{{ . }}"
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
