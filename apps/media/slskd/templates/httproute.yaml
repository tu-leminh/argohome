{{- range $name, $target := .Values.slskd.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "{{ $target.host }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "common.names.fullname" $ }}
          port: {{ $.Values.slskd.service.ports.http }}
          group: ""
          kind: Service
          weight: 1
{{- end }}
