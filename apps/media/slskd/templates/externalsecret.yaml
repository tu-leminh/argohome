apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-slskd-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: media-slskd-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.slskd.secretPath }}
