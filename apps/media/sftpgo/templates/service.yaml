apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.sftpgo.service.type | default "ClusterIP" }}
  {{- if .Values.sftpgo.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.sftpgo.service.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.sftpgo.service.sftpPort }}
      targetPort: sftp
      protocol: TCP
      name: sftp
      {{- if .Values.sftpgo.service.sftpNodePort }}
      nodePort: {{ .Values.sftpgo.service.sftpNodePort }}
      {{- end }}
    - port: {{ .Values.sftpgo.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.sftpgo.service.httpNodePort }}
      nodePort: {{ .Values.sftpgo.service.httpNodePort }}
      {{- end }}
  selector:
    {{- include "common.labels.selector" . | nindent 4 }}
{{- if .Values.sftpgo.webdavService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-webdav
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.sftpgo.webdavService.type | default "LoadBalancer" }}
  {{- if .Values.sftpgo.webdavService.loadBalancerIP }}
  loadBalancerIP: {{ .Values.sftpgo.webdavService.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.sftpgo.webdavService.port }}
      targetPort: webdav
      protocol: TCP
      name: webdav
  selector:
    {{- include "common.labels.selector" . | nindent 4 }}
{{- end }}
