{{- range $name, $target := .Values.sftpgo.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
  hostnames:
    - "{{ $target.host }}"
  rules:
    - backendRefs:
        - name: {{ include "common.names.fullname" $ }}
          port: {{ $.Values.sftpgo.service.httpPort }}
{{- end }}

{{- range $name, $target := .Values.sftpgo.webdavIngressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo-webdav-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
  hostnames:
    - "{{ $target.host }}"
  rules:
    - backendRefs:
        - name: {{ include "common.names.fullname" $ }}
          port: {{ $.Values.sftpgo.service.webdavPort }}
{{- end }}
