q3:
  image:
    repository: lscr.io/linuxserver/qbittorrent
    tag: latest
    pullPolicy: Always

  service:
    type: LoadBalancer
    loadBalancerIP: 10.0.1.12
    port: 80

  persistence:
    config:
      enabled: true
      existingClaim: media-q3-config-pvc
    data:
      enabled: true
      existingClaim: media-shared-data-pvc
      mountPath: /data

  ingressTargets:
    duckdns:
      host: q3.epricesx.duckdns.org
    freemyip:
      host: q3.lmtu.freemyip.com
    myaddr:
      host: q3.lmtlmt.myaddr.io

  torrentService:
    enabled: true
    port: 31083
