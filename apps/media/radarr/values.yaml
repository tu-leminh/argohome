radarr:
  image:
    repository: lscr.io/linuxserver/radarr
    tag: latest
    pullPolicy: Always
  env:
    TZ: Etc/UTC
    PUID: 1000
    PGID: 1000
  
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.151
    port: 7878

  persistence:
    config:
      enabled: true
      existingClaim: media-radarr-config-pvc
    data:
      enabled: true
      existingClaim: media-shared-data-pvc
      mountPath: /data
  
  ingressTargets:
    duckdns:
      host: radarr.epricesx.duckdns.org
    freemyip:
      host: radarr.lmtu.freemyip.com
    myaddr:
      host: radarr.lmtlmt.myaddr.io
