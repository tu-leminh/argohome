qui:
  image:
    repository: ghcr.io/autobrr/qui
    tag: latest
    pullPolicy: Always

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.156
    port: 3000

  persistence:
    config:
      enabled: true
      existingClaim: media-qui-config-pvc
    downloads:
      enabled: false
      existingClaim: media-shared-downloads-pvc
      mountPath: /downloads

  ingressTargets:
    duckdns:
      host: qui.epricesx.duckdns.org
      certResolver: letsencrypt
    freemyip:
      host: qui.lmtu.freemyip.com
      certResolver: freemyip
      tlsDomain: "*.lmtu.freemyip.com"
      tlsSans:
        - lmtu.freemyip.com
    myaddr:
      host: qui.lmtlmt.myaddr.io
      certResolver: myaddr
