apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.selector" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: qui
          image: "{{ .Values.qui.image.repository }}:{{ .Values.qui.image.tag }}"
          imagePullPolicy: {{ .Values.qui.image.pullPolicy }}
          command: ["qui", "serve", "--config-dir", "/config"]
          ports:
            - name: webui
              containerPort: 7476
              protocol: TCP
          env:
            - name: TZ
              value: "{{ .Values.qui.env.TZ }}"
          volumeMounts:
            {{- if .Values.qui.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- if .Values.qui.persistence.downloads.enabled }}
            - name: downloads
              mountPath: {{ .Values.qui.persistence.downloads.mountPath }}
            {{- end }}
            {{- if .Values.qui.persistence.movies.enabled }}
            - name: movies
              mountPath: {{ .Values.qui.persistence.movies.mountPath }}
            {{- end }}
            {{- if .Values.qui.persistence.shows.enabled }}
            - name: shows
              mountPath: {{ .Values.qui.persistence.shows.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.qui.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.config.existingClaim }}
        {{- end }}
        {{- if .Values.qui.persistence.downloads.enabled }}
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.downloads.existingClaim }}
        {{- end }}
        {{- if .Values.qui.persistence.movies.enabled }}
        - name: movies
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.movies.existingClaim }}
        {{- end }}
        {{- if .Values.qui.persistence.shows.enabled }}
        - name: shows
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.shows.existingClaim }}
        {{- end }}