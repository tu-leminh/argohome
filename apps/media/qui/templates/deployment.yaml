apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.selector" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # fsGroup is ignored on hostPath PVs, so chown /config as root before
        # the (uid 1000) generate-config init container runs. Shared data
        # dir is auto-created root:root by containerd too - chmod its
        # top-level dirs (not -R, library is huge) to 777 so any app,
        # regardless of uid, can manage downloaded files under them.
        - name: fix-perms
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /config
              chmod 777 /data /data/downloads /data/movies /data/shows 2>/dev/null || true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.qui.persistence.data.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
        - name: qui-init-config
          image: "{{ .Values.qui.image.repository }}:{{ .Values.qui.image.tag }}"
          imagePullPolicy: {{ .Values.qui.image.pullPolicy }}
          # `qui serve` fails immediately if config.toml doesn't already
          # exist rather than creating it itself; generate it once, if
          # missing, before the main container starts.
          command:
            - sh
            - -c
            - '[ -f /config/config.toml ] || qui generate-config --config-dir /config'
          volumeMounts:
            {{- if .Values.qui.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
      containers:
        - name: qui
          image: "{{ .Values.qui.image.repository }}:{{ .Values.qui.image.tag }}"
          imagePullPolicy: {{ .Values.qui.image.pullPolicy }}
          command: ["qui", "serve", "--config-dir", "/config"]
          ports:
            - name: webui
              containerPort: 7476
              protocol: TCP
          env:
            - name: TZ
              value: "{{ .Values.qui.env.TZ }}"
          volumeMounts:
            {{- if .Values.qui.persistence.config.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- if .Values.qui.persistence.data.enabled }}
            - name: data
              mountPath: {{ .Values.qui.persistence.data.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.qui.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.config.existingClaim }}
        {{- end }}
        {{- if .Values.qui.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.qui.persistence.data.existingClaim }}
        {{- end }}