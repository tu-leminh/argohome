image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingressTargets:
  myaddr:
    host: lmtlmt.myaddr.io
    certResolver: myaddr
  duckdns:
    host: epricesx.duckdns.org
    certResolver: letsencrypt
  freemyip:
    host: lmtu.freemyip.com
    certResolver: freemyip

# Homepage Configuration
config:
  services:
    - Infrastructure:
        - Argo CD:
            # Verified: "argo-cd.png" is the correct filename in the main branch
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/argo-cd.png
            href: https://argo.lmtlmt.myaddr.io
            description: GitOps Deployment
        - Traefik:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/traefik.png
            href: https://traefik.lmtlmt.myaddr.io/dashboard/
            description: Ingress Controller

    - Media:
        - Jellyfin:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/jellyfin.png
            href: https://jellyfin.lmtlmt.myaddr.io
            description: Media Server
        - Sonarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/sonarr.png
            href: https://sonarr.lmtlmt.myaddr.io
            description: TV Shows
        - Radarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/radarr.png
            href: https://radarr.lmtlmt.myaddr.io
            description: Movies
        - Prowlarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/prowlarr.png
            href: https://prowlarr.lmtlmt.myaddr.io
            description: Indexer Manager
        - Q1:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q1.lmtlmt.myaddr.io
            description: Torrent Client
        - Q2:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q2.lmtlmt.myaddr.io
            description: Torrent Client
        - Q3:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/qbittorrent.png
            href: https://q3.lmtlmt.myaddr.io
            description: Torrent Client
        - Deluge:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/deluge.png
            href: https://deluge.lmtlmt.myaddr.io
            description: Torrent Client
        - Bazarr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/bazarr.png
            href: https://bazarr.lmtlmt.myaddr.io
            description: Subtitles Manager
        - Autobrr:
            icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/autobrr.png
            href: https://autobrr.lmtlmt.myaddr.io
            description: Torrent Automation

  widgets: []

  settings:
    title: Home Lab
    theme: dark
    color: slate
    cardBlur: sm
    layout:
      Infrastructure:
        style: row
        columns: 3
      Media:
        style: row
        columns: 6

    # BACKGROUND IMAGE CONFIGURATION
    background:
      # Option 1: Minimal Saturn (Active) - Matches Macchiato Palette
      image: https://raw.githubusercontent.com/iruzo/wp/main/desktop-catppuccin-macchiato-saturn.jpg
      
      # Option 2: Paint Swirl (Uncomment to use)
      # image: https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/main/abstract/paint-swirl-macchiato.png
      
      # Option 3: Minimal Mountains (Uncomment to use)
      # image: https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/main/landscapes/mountains_macchiato.png
      
      opacity: 0.8 # Dim the background slightly so text pops

    # CSS to force the correct Macchiato Colors on cards and text
    customssh: |
      :root {
        --ctp-macchiato-base: #24273a;
        --ctp-macchiato-mantle: #1e2030;
        --ctp-macchiato-crust: #181926;
        --ctp-macchiato-text: #cad3f5;
        --ctp-macchiato-surface0: #363a4f;
      }
      /* Apply transparent dark background to cards so wallpaper shows through slightly */
      .services .service {
        background: rgba(54, 58, 79, 0.85) !important; /* Macchiato Surface0 with opacity */
        border: 1px solid var(--ctp-macchiato-mantle);
        backdrop-filter: blur(5px);
      }
      .service-name {
        color: var(--ctp-macchiato-text) !important;
      }
      .service-desc {
        color: #a5adcb !important;
      }
