{{- range $name, $target := .Values.ingressTargets }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra
  hostnames:
    - "{{ $target.host }}"
  rules:
    - backendRefs:
        - name: homepage
          port: 3000
{{- end }}
