apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`argo.lmtu.freemyip.com`) || Host(`argo.epricesx.duckdns.org`)
    kind: Rule
    services:
    - name: argocd-server
      port: 80
  tls:
    certResolver: letsencrypt
