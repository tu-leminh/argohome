{{- range $name, $target := .Values.ingressTargets }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ $target.host }}`)
    kind: Rule
    services:
    - name: {{ $.Release.Name }}-server
      port: 80
  tls:
    {{- if $target.certResolver }}
    certResolver: {{ $target.certResolver }}
    {{- else }}
    {}
    {{- end }}
{{- end }}