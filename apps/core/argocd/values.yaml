argo-cd:
  configs:
    cm:
      url: "" # Explicitly empty to support multi-domain access
      exec.enabled: "true"
  server:
    insecure: true
    service:
      type: LoadBalancer
      loadBalancerIP: "192.168.1.112"
      externalTrafficPolicy: Local
    ingress:
      enabled: false

ingressTargets:
  duckdns:
    host: argo.epricesx.duckdns.org
    certResolver: letsencrypt
  freemyip:
    host: argo.lmtu.freemyip.com
    certResolver: freemyip
  myaddr:
      host: lmtlmt.myaddr.io
      path: /argo
      certResolver: myaddr
  local-ip:
    host: "192.168.1.111"
    certResolver: ""