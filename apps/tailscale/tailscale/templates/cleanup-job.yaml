# Runs on every operator (re)deploy, before the operator reconciles.
# Wipes operator-managed devices (tag:k8s, tag:k8s-operator) from the tailnet —
# even ones still online — so the operator re-registers fresh ones for the
# current Ingresses. Idempotent:
# always starts from a clean slate, so a replaced tailscale namespace never
# leaves stale connections behind. Personal tailnet devices are untouched.
apiVersion: batch/v1
kind: Job
metadata:
  name: tailscale-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: alpine:3.20
          envFrom:
            - secretRef:
                name: tailscale-secret
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              apk add --no-cache curl jq >/dev/null

              echo "Authenticating to Tailscale API..."
              TOKEN=$(curl -sf \
                -d "client_id=$client_id" \
                -d "client_secret=$client_secret" \
                -d "grant_type=client_credentials" \
                https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)

              echo "Removing operator devices (tag:k8s, tag:k8s-operator) from $TAILNET..."
              echo "  (removes matching devices even if still online — operator re-registers them)"
              curl -sf -H "Authorization: Bearer $TOKEN" \
                "https://api.tailscale.com/api/v2/tailnet/$TAILNET/devices" \
                | jq -r '.devices[] | select((.tags // []) | any(. == "tag:k8s" or . == "tag:k8s-operator")) | .id' \
                | while read -r id; do
                    echo "  removing $id"
                    curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                      "https://api.tailscale.com/api/v2/device/$id" \
                      || echo "  warning: failed to remove $id, continuing"
                  done
              echo "Cleanup complete."
