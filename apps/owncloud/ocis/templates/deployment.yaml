apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels.selector" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      initContainers:
        - name: init-ocis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /etc/ocis/ocis.yaml ]; then
                ocis init --insecure yes
              fi
          volumeMounts:
            - name: ocis-config
              mountPath: /etc/ocis
            - name: ocis-data
              mountPath: /var/lib/ocis
      containers:
        - name: ocis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: ocis-config
              mountPath: /etc/ocis
            - name: ocis-data
              mountPath: /var/lib/ocis
      volumes:
        - name: ocis-config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim }}
        - name: ocis-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}