apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ocis-transport
  namespace: {{ .Release.Namespace }}
spec:
  insecureSkipVerify: true
{{- range $name, $target := .Values.ingressTargets }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ocis-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ $target.host }}`){{- if $target.path }} && PathPrefix(`{{ $target.path }}`){{- end }}
    kind: Rule
    services:
    - name: {{ include "common.names.fullname" $ }}
      port: {{ $.Values.service.port }}
      scheme: https
      serversTransport: ocis-transport
  tls:
    certResolver: {{ $target.certResolver }}
    {{- if $target.tlsDomain }}
    domains:
    - main: "{{ $target.tlsDomain }}"
      {{- if $target.tlsSans }}
      sans:
        {{- range $target.tlsSans }}
        - "{{ . }}"
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}