apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.nextcloud.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.nextcloud.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "common.labels.selector" . | nindent 4 }}
