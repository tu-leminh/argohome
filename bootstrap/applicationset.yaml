apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-bootstrap
  namespace: core
spec:
  generators:
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/tailscale/*
      values:
        syncWave: "-5"
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/core/*
      values:
        syncWave: "-5"
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/infra/*
      values:
        syncWave: "-1"
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/media/*
      values:
        syncWave: "5"
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/nextcloud/*
      values:
        syncWave: "5"
  - git:
      repoURL: https://github.com/tu-leminh/argohome
      revision: HEAD
      directories:
      - path: apps/owncloud/*
      values:
        syncWave: "5"
  template:
    metadata:
      name: '{{path[1]}}-{{path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{values.syncWave}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/tu-leminh/argohome
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true